packages:
  - apps/*
  - packages/*

# Refuse transitive deps that use non-registry protocols (github:, git:, file:,
# URL tarballs). Direct deps in our own package.json are unaffected. Default is
# true in pnpm 10.26+; pinned here to make the policy explicit.
blockExoticSubdeps: true

# Supply-chain hardening.
# Refuse to install package versions younger than this many minutes. Buys time
# for the npm/community to detect and yank malicious publishes before they land
# on a dev box or in CI. 4320 = 72h.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@aurboda/*'
  # Our own garmin-connect fork, published from fiddur/garmin-connect CI.
  - '@fiddur/garmin-connect'

# SDK 1.32.2 pins AJV 8.17.1; keep its validator and URI parser on patched releases.
overrides:
  '@opentelemetry/core@>=2.0.0 <2.8.0': 2.8.0
  'ajv@>=8.0.0 <8.18.0': 8.20.0
  # archiver-utils uses glob.sync; glob 14 retains it and resolves patched minimatch.
  'archiver-utils>glob': 14.0.4
  # Keep Dockerode's CommonJS v4 UUID API while removing the affected v10 release.
  'dockerode>uuid': 11.1.1
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  # get-uri 8 still requests basic-ftp 5; use the patched compatible Client API.
  'get-uri>basic-ftp': 6.2.4
  # The generator's schema parser pins an affected js-yaml patch.
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'satori>fflate': 0.7.5
patchedDependencies:
  pg@8.23.1: patches/pg@8.23.1.patch
