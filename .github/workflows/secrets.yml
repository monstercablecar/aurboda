name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all fetched history without publishing secret values
        shell: bash
        run: |
          set -euo pipefail
          result=0
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --redact=100 \
            --no-banner --log-level=error --report-format=json \
            --report-path="$RUNNER_TEMP/gitleaks-report.json" \
            > "$RUNNER_TEMP/gitleaks-output.txt" 2>&1 || result=$?
          if [[ "$result" -ne 0 ]]; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ['RUNNER_TEMP']) / 'gitleaks-report.json'
          if report.exists():
              findings = json.loads(report.read_text())
              print(f'Secret scanner flagged {len(findings)} candidates. Review before merging.')
              for finding in findings:
                  print(json.dumps({key: finding.get(key) for key in ('RuleID', 'File', 'StartLine', 'Commit', 'Fingerprint')}))
          else:
              print('Secret scan could not complete. No clean result is established.')
          PY
            exit "$result"
          fi
          echo 'No secrets detected by Gitleaks in fetched Git history.'
